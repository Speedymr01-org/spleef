name: Spleef
version: ${project.version}
main: com.Speedymr01.spleef.SpleefPlugin
api-version: '1.21'
author: Speedymr01
description: Classic Spleef minigame for Paper

commands:
  spleef:
    description: Main Spleef command
    usage: /<command> [join|leave|start|stop|arena|list|info]
    aliases: [sp]

permissions:
  spleef.admin:
    description: Allows using admin Spleef commands
    default: op
